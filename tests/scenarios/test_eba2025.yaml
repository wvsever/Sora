# Fixed test scenario for golden results. SYNTHETIC: the macro paths are the EBA 2025 published
# scenario, applied to the 30 June 2026 test dataset as projection years 1-3. The satellite
# coefficients are synthetic (tests/params/synthetic_satellites.csv, synthetic_sector_satellites.csv). Not a real calibration.
name: test_eba2025
macro_path: scenarios/eba2025_macro.csv
year_map: {1: 2025, 2: 2026, 3: 2027}      # projection year -> scenario year
history_year: 2024                          # starting values of level variables (unemployment)
satellites: tests/params/synthetic_satellites.csv
normal_gdp_growth: 1.5                      # % p.a.; GDP growth above this lowers PDs
country_fallback: [WR, EU]                  # macro key when a country has no scenario data; OTHER -> EU
scope:
  measurement_categories: [amortised_cost]
  exposure_types: [loan, finance_lease, debt_security]
  exclude_intragroup: true
off_balance:                                # CR_SCEN_OFF_BS; measurement and intragroup scope as above
  exposure_types: [loan_commitment, financial_guarantee, other_commitment]
  ccf_fallback:                             # used when no customer CCF: CRR Art. 111(2) buckets (Annex I)
    loan_commitment: 0.4
    financial_guarantee: 1.0
    other_commitment: 0.5
    unconditionally_cancellable: 0.1        # loan/other commitments cancellable at any time (CRR3, Art. 495d)
  include_loan_undrawn: true                # undrawn part of in-scope loans: loan commitments given, loan's segment
  commitment_drawn_on_balance: true         # drawn part (GCA) of these commitments: on-balance loans and advances
benchmark_parameters:                       # ECB credit-risk benchmarks (EBA MN 2027 draft paras 115-117, 146)
  file: tests/params/synthetic_ecb_benchmarks.csv   # SYNTHETIC values, not ECB benchmarks
  coverage_threshold: 0.10                  # satellite model coverage per pivot asset class (the "10% rule")
  model_level: portfolio                    # coarsest calibration level that counts as a model: segment | portfolio
  sovereign: true                           # general governments: the country's benchmark is mandatory (para 146)
  country_fallback: [WR, EU]                # benchmark key for OTHER and countries without benchmarks
sector_satellites:                          # sectoral (GVA) satellites for NFC exposures by NACE sector (MN 2027 para 114)
  file: tests/params/synthetic_sector_satellites.csv   # SYNTHETIC coefficients
  gva_fallback: [EU]                        # sector GVA deviation from GDP for countries without GVA paths (non-EU)
nii:                                        # net interest income, static balance sheet (EBA MN 2025 section 4, plans/13_nii.md)
  own_rating: A                             # SYNTHETIC S&P rating of the bank: Box 23 idiosyncratic shock (adverse), 50 bps
  new_business_months: 12                   # margin of new business: positions originated in the last 12 months (para 353)
segmentation:
  top_countries: 10
calibration:
  min_observations: 100                     # contract-months per from-stage before falling back to the parent segment
  pd_floor: 0.00001                         # 0.001% technical floor
  consecutive_months_only: true
constraints:
  no_cure_from_s3: true
  adverse_final_year_blend: [0.8333333333333334, 0.16666666666666666]   # 5/6 adverse + 1/6 baseline (Boxes 4-5)
