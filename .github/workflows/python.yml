name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sora-tools
        run: pip install -e "python[test,scenario,mcp]"
      - name: Extract reference test data
        run: python tools/extract_testdata.py
      - name: Lint SIM schema
        run: sora-tools schema lint
      - name: Tests
        run: python -m pytest python/tests -q
