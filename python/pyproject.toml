[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-tools"
version = "0.1.0"
description = "Sora tooling: SIM schema, SQL mapping on exported files, validation, calculator stub"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
scenario = ["openpyxl>=3.1"]
test = ["pytest>=8", "py7zr>=0.21", "jsonschema>=4.18", "openpyxl>=3.1"]

[project.scripts]
sora-tools = "sora_tools.cli:main"

[tool.setuptools.packages.find]
include = ["sora_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stub_only: checks specific to the built-in calculator stub"]
